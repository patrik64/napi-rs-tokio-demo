[package]
name = "tokio-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `tokio_rt` is the feature this project showcases: it lets `#[napi]` export
# `async fn`s as Promise-returning functions driven by a tokio runtime.
napi = { version = "3", default-features = false, features = ["napi9", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "macros"] }
tokio-util = "0.7"
fastrand = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
